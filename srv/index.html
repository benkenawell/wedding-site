{{$dict := include "./data/wedding-dates.json" | fromJson }}
{{$name := .Req.URL.Query.Get "name" | default "katie" }}
<!DOCTYPE html>
<html>
  <head>
    <title>Wedding Countdown</title>

    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="stylesheets/application.css" />
    <link rel="stylesheet" href="stylesheets/timer.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Satisfy" />
    <script type="importmap">
      {
        "imports": {
          "luxon": "./js/luxon.js"
        }
      }
    </script>
    <script type="module" src="/js/timer-element.js"></script>
    <script type="module" src="/js/swipe-event.js"></script>
    <script type="module" src="/js/interval-switcher.js"></script>
  </head>
  <body>
    <timer-element
      class="timer"
      intervals="month day hour minute second"
      date-target="{{ get $dict $name }}"
    >
        Loading...
      </timer-element>
  </body>
</html>
